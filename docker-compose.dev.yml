volumes:
  cache_data:
    driver: local

services:
  backend:
    build: .
    container_name: windex-backend-dev
    ports:
      - "5123:5001"
    volumes:
      - ./wind_data:/app/wind_data
      - cache_data:/data/cache
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5001
    restart: unless-stopped

  frontend:
    build:
      context: ./windex-site
      dockerfile: Dockerfile
      target: dev
    container_name: windex-frontend-dev
    ports:
      - "3123:3000"
    volumes:
      - ./windex-site:/app
      - cache_data:/data/cache
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:5123
    depends_on:
      - backend
    restart: unless-stopped
